# A PostgreSQL server of the integration suites' own. They mutate cluster-wide
# roles and clean their fixtures up with trigger and foreign-key enforcement
# suspended, so sharing a server with the local stack would
# put that installation's owner identity and login roles within their reach.
# Its data lives in memory: nothing here is meant to survive the container.
name: context-use-test

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: context_use_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d context_use_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: context-use
      MINIO_ROOT_PASSWORD: test-only-minio-secret
    ports: ["127.0.0.1:59000:9000"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
