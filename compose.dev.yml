x-code-service: &code-service
  build:
    context: .
    dockerfile: Dockerfile.dev
  working_dir: /app
  volumes:
    - .:/app
    - dependencies:/app/node_modules
  # A host-side Bun install can leave workspace node_modules links that target
  # a host-specific layout. Mask them so containers consistently resolve from
  # the dependency volume installed by Dockerfile.dev.
  tmpfs:
    - /app/apps/cli/node_modules
    - /app/apps/server/node_modules
    - /app/apps/web/node_modules
    - /app/packages/database/node_modules
    - /app/packages/shared/node_modules

x-common: &common
  NODE_ENV: development
  APP_ORIGIN: http://localhost:5173
  ASSET_ORIGIN: http://localhost:5173
  OAUTH_ISSUER: http://localhost:5173
  MCP_RESOURCE: http://localhost:5173/mcp

x-role-passwords: &role-passwords
  DB_PRIVATE_PASSWORD: development-only
  DB_CORPUS_PASSWORD: development-only
  DB_PUBLIC_PASSWORD: development-only
  DB_STORAGE_PASSWORD: development-only
  DB_BACKUP_PASSWORD: development-only

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: context_use
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d context_use"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: context-use
      MINIO_ROOT_PASSWORD: development-only-minio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  object-storage-init:
    <<: *code-service
    depends_on:
      minio: { condition: service_healthy }
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: context-use
      AWS_SECRET_ACCESS_KEY: development-only-minio-secret
      AWS_EC2_METADATA_DISABLED: "true"
      ASSET_BUCKET: context-use
      S3_ENDPOINT: http://minio:9000
    command: ["bun", "apps/server/src/storage/repositories/object-storage-init.ts"]
    restart: "no"

  migrate:
    <<: *code-service
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *role-passwords
      MIGRATOR_DATABASE_URL: postgres://postgres:postgres@postgres:5432/context_use
    command: ["bun", "run", "db:initialize"]
    restart: "no"

  storage-socket-init:
    <<: *code-service
    user: "0:0"
    network_mode: none
    command: ["sh", "-c", "chown bun:bun /run/context-use-storage && chmod 0700 /run/context-use-storage"]
    volumes: [storage-socket:/run/context-use-storage]
    restart: "no"

  storage:
    <<: *code-service
    depends_on:
      migrate: { condition: service_completed_successfully }
      object-storage-init: { condition: service_completed_successfully }
      storage-socket-init: { condition: service_completed_successfully }
    environment:
      <<: *common
      STORAGE_DATABASE_URL: postgres://context_use_storage:development-only@postgres:5432/context_use
      STORAGE_SOCKET_PATH: /run/context-use-storage/storage.sock
      STORAGE_PRIVATE_TOKEN: development-storage-private-token
      STORAGE_PUBLIC_TOKEN: development-storage-public-token
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: context-use
      AWS_SECRET_ACCESS_KEY: development-only-minio-secret
      AWS_EC2_METADATA_DISABLED: "true"
      ASSET_BUCKET: context-use
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
    command: ["bun", "apps/server/src/storage/index.ts"]
    volumes:
      - .:/app
      - dependencies:/app/node_modules
      - storage-socket:/run/context-use-storage
    restart: unless-stopped

  hypermedia-bootstrap:
    <<: *code-service
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_started }
    environment:
      CORPUS_DATABASE_URL: postgres://context_use_corpus:development-only@postgres:5432/context_use
      STORAGE_SOCKET_PATH: /run/context-use-storage/storage.sock
      STORAGE_PRIVATE_TOKEN: development-storage-private-token
    command:
      - sh
      - -ec
      - >-
        until [ -S /run/context-use-storage/storage.sock ]; do sleep 0.1; done;
        exec bun apps/server/src/private/hypermedia-bootstrap/index.ts
    volumes:
      - .:/app
      - dependencies:/app/node_modules
      - storage-socket:/run/context-use-storage:ro
    restart: "no"

  private-app:
    <<: *code-service
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_started }
      hypermedia-bootstrap: { condition: service_completed_successfully }
    environment:
      <<: *common
      PORT: "3000"
      PRIVATE_DATABASE_URL: postgres://context_use_private:development-only@postgres:5432/context_use
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: context-use
      OWNER_EMAIL: ${OWNER_EMAIL:-you@example.com}
      OWNER_SETUP_TOKEN_HASH: 0c3f0f8b90068b05d8039bf05db2da4742c31a23e51cfa864a96a0efe17b1694
      BETTER_AUTH_SECRET: development-only-secret-that-is-long-enough
      MCP_ASSET_CAPABILITY_SECRET: development-only-mcp-capability-secret
      STORAGE_SOCKET_PATH: /run/context-use-storage/storage.sock
      STORAGE_PRIVATE_TOKEN: development-storage-private-token
      WEB_DIST: /app/apps/web/dist
    command: ["bun", "--watch", "apps/server/src/private/index.ts"]
    volumes:
      - .:/app
      - dependencies:/app/node_modules
      - storage-socket:/run/context-use-storage:ro
    restart: unless-stopped

  public-app:
    <<: *code-service
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_started }
      hypermedia-bootstrap: { condition: service_completed_successfully }
    environment:
      <<: *common
      PORT: "3005"
      PUBLIC_DATABASE_URL: postgres://context_use_public:development-only@postgres:5432/context_use
      STORAGE_SOCKET_PATH: /run/context-use-storage/storage.sock
      STORAGE_PUBLIC_TOKEN: development-storage-public-token
    command: ["bun", "--watch", "apps/server/src/public/index.ts"]
    volumes:
      - .:/app
      - dependencies:/app/node_modules
      - storage-socket:/run/context-use-storage:ro
    restart: unless-stopped

  gateway:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    depends_on: [private-app, public-app]
    volumes: [./deploy/Caddyfile.dev:/etc/caddy/Caddyfile:ro]
    restart: unless-stopped

  web:
    <<: *code-service
    depends_on:
      gateway: { condition: service_started }
    environment:
      VITE_API_PROXY_TARGET: http://gateway:8080
    command: ["bun", "--cwd", "apps/web", "dev", "--host", "0.0.0.0"]
    ports: ["5173:5173"]
    restart: unless-stopped

volumes:
  postgres-data:
  dependencies:
  minio-data:
  storage-socket:
